spring.application.name=storystream-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/storystream}
spring.datasource.username=${DB_USER:storystream}
spring.datasource.password=${DB_PASSWORD:storystream_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seed a small demo catalog on first start.
storystream.seed-demo-data=true
# Comma-separated origins allowed to call the API (the Vite dev server by default).
storystream.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health,info,metrics
